	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
	<main class="app-shell">
		<header class="top-area" aria-label="Bendravimo įrankiai">
			<div class="desktop-search-row">
				<button class="desktop-home" id="desktop-home" type="button" aria-label="Pagrindinis">
					<img src="NAVIGACIJOA IKONOS/PRADŽIA.svg" alt="">
				</button>
				<label class="search-box">
					<span class="sr-only">Ieškoti žodyno kortelių</span>
					<input type="search" placeholder="Ieškoti žodžio...">
					<svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
						<circle cx="10.8" cy="10.8" r="6.3" />
						<path d="m15.5 15.5 4.2 4.2" />
					</svg>
				</label>
			</div>

			<div class="sticky-message-panel">
				<section class="composer" aria-label="Sakinio redaktorius">
					<div class="composer-copy">
						<p class="greeting">Labas, <span aria-hidden="true">👋</span></p>
						<p class="composer-hint">Ką norėtum pasakyti?</p>
					</div>
					<div class="selected-words" id="selected-words" role="list" aria-label="Pasirinktos kortelės" hidden></div>
				</section>
				<details class="quick-phrase-dropdown">
					<summary>
						<span>VEIKSMAI</span>
						<span class="quick-phrase-chevron" aria-hidden="true">›</span>
					</summary>
					<div class="quick-phrases" aria-label="Greitos frazės">
				<button class="phrase-chip" type="button" data-audio-src="garsai/noriu.mp3"><img src="ikonos/NORIU.svg" alt=""> <span class="phrase-chip-label">NORIU</span> <b aria-hidden="true"><img src="ikonos/Plus.svg" alt=""></b></button>
				<button class="phrase-chip" type="button" data-audio-src="garsai/padėk.mp3"><img src="ikonos/padėk.svg" alt=""> <span class="phrase-chip-label">PADĖK</span> <b aria-hidden="true"><img src="ikonos/Plus.svg" alt=""></b></button>
				<button class="phrase-chip" type="button" data-audio-src="garsai/taip.mp3"><img src="ikonos/taip.svg" alt=""> <span class="phrase-chip-label">TAIP</span> <b aria-hidden="true"><img src="ikonos/Plus.svg" alt=""></b></button>
				<button class="phrase-chip" type="button" data-audio-src="garsai/ne.mp3"><img src="ikonos/ne.svg" alt=""> <span class="phrase-chip-label">NE</span> <b aria-hidden="true"><img src="ikonos/Plus.svg" alt=""></b></button>
				<button class="phrase-chip" type="button" data-audio-src="garsai/eiti.mp3"><img src="ikonos/eiti.svg" alt=""> <span class="phrase-chip-label">EITI</span> <b aria-hidden="true"><img src="ikonos/Plus.svg" alt=""></b></button>
				<button class="phrase-chip" type="button"><img src="ikonos/Car.svg" alt=""> <span class="phrase-chip-label">VAŽIUOTI</span> <b aria-hidden="true"><img src="ikonos/Plus.svg" alt=""></b></button>
				<button class="phrase-chip" type="button"><img src="ikonos/valgyti.svg" alt=""> <span class="phrase-chip-label">VALGYTI</span> <b aria-hidden="true"><img src="ikonos/Plus.svg" alt=""></b></button>
				<button class="phrase-chip" type="button"><img src="ikonos/gerti.svg" alt=""> <span class="phrase-chip-label">GERTI</span> <b aria-hidden="true"><img src="ikonos/Plus.svg" alt=""></b></button>
					</div>
				</details>
			</div>
		</header>

		function openPersonalCardDatabase() {
			if (!("indexedDB" in window)) {
				return Promise.reject(new Error("Vietinė saugykla šiame įrenginyje nepasiekiama."));
			}
			if (!personalCardDatabasePromise) {
				personalCardDatabasePromise = new Promise((resolve, reject) => {
					const request = window.indexedDB.open("voicer-personal-cards", 1);
					request.onupgradeneeded = () => {
						if (!request.result.objectStoreNames.contains("cards")) {
							request.result.createObjectStore("cards", { keyPath: "id" });
						}
					};
					request.onsuccess = () => resolve(request.result);
					request.onerror = () => reject(request.error || new Error("Nepavyko atverti vietinės saugyklos."));
				});
			}
			return personalCardDatabasePromise;
		}

		async function loadPersonalCards() {
			const database = await openPersonalCardDatabase();
			return new Promise((resolve, reject) => {
				const request = database.transaction("cards", "readonly").objectStore("cards").getAll();
				request.onsuccess = () => resolve(request.result.sort((left, right) => right.createdAt - left.createdAt));
				request.onerror = () => reject(request.error || new Error("Nepavyko įkelti kortelių."));
			});
		}

		async function savePersonalCard(card) {
			const database = await openPersonalCardDatabase();
			return new Promise((resolve, reject) => {
				const transaction = database.transaction("cards", "readwrite");
				transaction.objectStore("cards").put(card);
				transaction.oncomplete = () => resolve();
				transaction.onerror = () => reject(transaction.error || new Error("Nepavyko išsaugoti kortelės."));
				transaction.onabort = () => reject(transaction.error || new Error("Kortelės išsaugoti nepavyko."));
			});
		}

		function toGenitive(word) {
			const normalizedWord = word.toLocaleLowerCase("lt-LT");
			if (genitiveOverrides.has(normalizedWord)) {
				return genitiveOverrides.get(normalizedWord);
			}

			if (normalizedWord.endsWith("iai")) {
				return `${normalizedWord.slice(0, -3)}ių`;
			}
			if (normalizedWord.endsWith("ai")) {
				return `${normalizedWord.slice(0, -2)}ų`;
			}
			if (normalizedWord.endsWith("ės")) {
				return `${normalizedWord.slice(0, -2)}ių`;
			}
			if (normalizedWord.endsWith("os")) {
				return `${normalizedWord.slice(0, -2)}ų`;
			}
			if (normalizedWord.endsWith("ys")) {
				return `${normalizedWord.slice(0, -2)}io`;
			}
			if (normalizedWord.endsWith("as")) {
				return `${normalizedWord.slice(0, -2)}o`;
			}
			if (normalizedWord.endsWith("is")) {
				return `${normalizedWord.slice(0, -2)}io`;
			}
			if (normalizedWord.endsWith("ė")) {
				return `${normalizedWord.slice(0, -1)}ės`;
			}
			if (normalizedWord.endsWith("a")) {
				return `${normalizedWord.slice(0, -1)}os`;
			}
			if (normalizedWord.endsWith("us")) {
				return `${normalizedWord.slice(0, -2)}aus`;
			}
			return word;
		}

		function composeSentenceWords() {
			return selectedWords.map(({ word }, index) => {
				const previousWord = selectedWords[index - 1]?.word.toLocaleLowerCase("lt-LT");
				return previousWord === "noriu" ? toGenitive(word) : word.toLocaleLowerCase("lt-LT");
			});
		}

		function composeSentence() {
			const sentence = composeSentenceWords().join(" ").trim();
			if (!sentence) {
				return "";
			}
			const punctuatedSentence = sentence.replace(/[.!?]+$/, "");
			return `${punctuatedSentence.charAt(0).toLocaleUpperCase("lt-LT")}${punctuatedSentence.slice(1)}.`;
		}

		function stopAudioPlayback() {
			if ("speechSynthesis" in window) {
				window.speechSynthesis.cancel();
			}
			if (activeAudioPlayer) {
				activeAudioPlayer.pause();
				activeAudioPlayer.removeAttribute("src");
				activeAudioPlayer.load();
				activeAudioPlayer.remove();
				activeAudioPlayer = null;
			}
			if (activeAudioUrl) {
				URL.revokeObjectURL(activeAudioUrl);
				activeAudioUrl = "";
			}
		}

		function playAudioBlob(audioBlob) {
			stopAudioPlayback();
			return new Promise((resolve, reject) => {
				const audioUrl = URL.createObjectURL(audioBlob);
				const player = audioBlob.type.startsWith("video/") ? document.createElement("video") : new Audio();
				let finished = false;
				activeAudioPlayer = player;
				activeAudioUrl = audioUrl;
				player.src = audioUrl;
				if (player instanceof HTMLVideoElement) {
					player.playsInline = true;
					player.setAttribute("aria-hidden", "true");
					player.tabIndex = -1;
					player.style.position = "fixed";
					player.style.width = "1px";
					player.style.height = "1px";
					player.style.opacity = "0";
					document.body.append(player);
				}

				const finish = (error) => {
					if (finished) {
						return;
					}
					finished = true;
					URL.revokeObjectURL(audioUrl);
					if (activeAudioPlayer === player) {
						activeAudioPlayer = null;
						activeAudioUrl = "";
					}
					player.remove();
					if (error) {
						reject(error);
					} else {
						resolve();
					}
				};

				player.addEventListener("ended", () => finish(), { once: true });
				player.addEventListener("error", () => finish(new Error("Nepavyko paleisti MP3 įrašo.")), { once: true });
				player.play().catch(finish);
			});
		}

		async function loadAudioSource(audioSource) {

			try {

				return response.ok ? await response.blob() : null;
			} catch {

			}
		}

		async function speakSentence() {
			const sentenceWords = composeSentenceWords();
			const canPlayRecordings = selectedWords.length > 0 && selectedWords.every(({ audio, word }, index) =>
				audio instanceof Blob && sentenceWords[index] === word.toLocaleLowerCase("lt-LT")
			);

			if (canPlayRecordings) {
				try {
					for (const { audio } of selectedWords) {
						await playAudioBlob(audio);
					}
					return;
				} catch (error) {
					speakText(composeSentence());
					return;
				}
			}
			speakText(composeSentence());
		}

		function speakText(text) {

			const utterance = new SpeechSynthesisUtterance(text);
			utterance.lang = "lt-LT";
			window.speechSynthesis.speak(utterance);
		}

					itemsSubgroups.hidden = true;
					ingredientSubgroups.hidden = true;
					emotionGrid.hidden = false;
					emotionGrid.innerHTML = renderWordCards(personalItemsCards);
					emotionGrid.setAttribute("aria-label", `${subgroupName} kortelės`);
					return;
				}
				if (subgroupName === "Apranga") {
					emotionHeading.textContent = subgroupName;
					foodSubgroups.hidden = true;
					activitiesSubgroups.hidden = true;
					locationsSubgroups.hidden = true;
					cookingSubgroups.hidden = true;
					itemsSubgroups.hidden = true;
					ingredientSubgroups.hidden = true;
					emotionGrid.hidden = false;
					emotionGrid.innerHTML = renderWordCards(clothingCards);
					emotionGrid.setAttribute("aria-label", `${subgroupName} kortelės`);
					return;
				}
				if (subgroupName === "Higiena") {
					emotionHeading.textContent = subgroupName;
					foodSubgroups.hidden = true;
					activitiesSubgroups.hidden = true;
					locationsSubgroups.hidden = true;
					cookingSubgroups.hidden = true;
					itemsSubgroups.hidden = true;
					ingredientSubgroups.hidden = true;
					emotionGrid.hidden = false;
					emotionGrid.innerHTML = renderWordCards(hygieneCards);
					emotionGrid.setAttribute("aria-label", `${subgroupName} kortelės`);
					return;
				}
				if (subgroupName === "Skaičiai") {
					emotionHeading.textContent = subgroupName;
					foodSubgroups.hidden = true;
					activitiesSubgroups.hidden = true;
					locationsSubgroups.hidden = true;
					cookingSubgroups.hidden = true;
					itemsSubgroups.hidden = true;
					ingredientSubgroups.hidden = true;
					emotionGrid.hidden = false;
					emotionGrid.innerHTML = renderWordCards(numberCards);
					emotionGrid.setAttribute("aria-label", `${subgroupName} kortelės`);
					return;
				}
				if (subgroupName === "Spalvos") {
					emotionHeading.textContent = subgroupName;
					foodSubgroups.hidden = true;
					activitiesSubgroups.hidden = true;
					locationsSubgroups.hidden = true;
					cookingSubgroups.hidden = true;
					itemsSubgroups.hidden = true;
					ingredientSubgroups.hidden = true;
					emotionGrid.hidden = false;
					emotionGrid.innerHTML = renderWordCards(colorCards);
					emotionGrid.setAttribute("aria-label", `${subgroupName} kortelės`);
					return;
				}
				const words = subgroupCards[subgroupName] || Array.from({ length: 12 }, () => "Žodis");
				emotionHeading.textContent = subgroupName;
				foodSubgroups.hidden = true;
				activitiesSubgroups.hidden = true;
				locationsSubgroups.hidden = true;
				cookingSubgroups.hidden = true;
					itemsSubgroups.hidden = true;
				ingredientSubgroups.hidden = true;
				emotionGrid.hidden = false;
				if (subgroupName === "Namų ruoša") {
					emotionGrid.replaceChildren(householdChoresCards.content.cloneNode(true));
				} else if (subgroupName === "Namai") {
					emotionGrid.replaceChildren(homeLocationCards.content.cloneNode(true));
				} else if (subgroupName === "Viešos erdvės") {
					emotionGrid.replaceChildren(publicPlaceCards.content.cloneNode(true));
				} else if (subgroupName === "Gamta") {
					emotionGrid.replaceChildren(naturePlaceCards.content.cloneNode(true));
				} else if (subgroupName === "Poilsis") {
					emotionGrid.replaceChildren(restCards.content.cloneNode(true));
				} else if (subgroupName === "Pramogos") {
					emotionGrid.replaceChildren(entertainmentCards.content.cloneNode(true));
				} else {
					emotionGrid.innerHTML = renderWordCards(words);
				}
				emotionGrid.setAttribute("aria-label", `${emotionHeading.textContent} kortelės`);
			});
		});

		emotionGrid.addEventListener("click", (event) => {
			const card = event.target.closest(".emotion-card");
			if (!card) {
				return;
			}
			const word = card.querySelector("p")?.textContent.trim();
			const personalCard = personalCards.find(({ id }) => id === card.dataset.personalCardId);
			if (event.target.closest(".emotion-audio")) {
				if (personalCard?.audio instanceof Blob) {
					playAudioBlob(personalCard.audio).catch(() => speakText(word));
				} else {
					const normalizedWord = word.toLocaleLowerCase("lt-LT");
					const cardAudioSource = emotionHeading.textContent === "Mėsa"
						? meatAudioFiles.get(normalizedWord)
						: currentSubgroup && emotionHeading.textContent === "Daržovės"
							? vegetableAudioFiles.get(normalizedWord)
							: currentSubgroup && emotionHeading.textContent === "Pienas"
								? dairyAudioFiles.get(normalizedWord)
								: emotionAudioFiles.get(normalizedWord) || dishAudioFiles.get(normalizedWord);
					if (cardAudioSource) {
						loadAudioSource(cardAudioSource)
							.then((audioBlob) => audioBlob ? playAudioBlob(audioBlob) : speakText(word))
							.catch(() => speakText(word));
					} else {
						speakText(word);
					}
				}
				return;
			}
			addSelectedWord(word, personalCard?.photo || null, personalCard?.audio || null);
		});

		emotionGrid.addEventListener("keydown", (event) => {
			if (!event.target.matches(".emotion-card") || (event.key !== "Enter" && event.key !== " ")) {
				return;
			}
			event.preventDefault();
			const card = event.target;
			const personalCard = personalCards.find(({ id }) => id === card.dataset.personalCardId);
			addSelectedWord(card.querySelector("p")?.textContent.trim(), personalCard?.photo || null, personalCard?.audio || null);
		});

		document.querySelector(".quick-phrases").addEventListener("click", async (event) => {
			const phraseButton = event.target.closest(".phrase-chip");
			const phrase = phraseButton?.querySelector(".phrase-chip-label")?.textContent;
			if (phrase) {
				addSelectedWord(phrase, null, await loadPhraseAudio(phraseButton));
			}
		});

		selectedWordsTray.addEventListener("click", (event) => {
			const removeButton = event.target.closest("[data-remove-selected-word]");
			if (!removeButton) {
				return;
			}
			const selectedWordId = Number(removeButton.dataset.removeSelectedWord);
			selectedWords = selectedWords.filter(({ id }) => id !== selectedWordId);
			renderSelectedWords();
		});

		document.getElementById("sentence-speak").addEventListener("click", () => {
			speakSentence();
		});

		document.getElementById("create-card-button").addEventListener("click", async () => {
			await personalCardsReady;
			personalCardStatus.textContent = personalCardStorageError ? "Šiame įrenginyje nepavyko atverti vietinės saugyklos." : "";
			personalCardDialog.showModal();
			personalCardName.focus();
		});

		personalCardPhoto.addEventListener("change", () => {
			showPhotoPreview(personalCardPhoto.files[0]);
		});

		personalCardAudio.addEventListener("change", () => {
			showAudioPreview(personalCardAudio.files[0]);
		});

		document.getElementById("close-personal-card-dialog").addEventListener("click", () => personalCardDialog.close());
		document.getElementById("cancel-personal-card").addEventListener("click", () => personalCardDialog.close());
		personalCardDialog.addEventListener("close", () => {
			personalCardForm.reset();
			personalCardStatus.textContent = "";
			showPhotoPreview(null);
			showAudioPreview(null);
		});

		personalCardForm.addEventListener("submit", async (event) => {
			event.preventDefault();
			const name = personalCardName.value.trim();
			if (!name) {
				personalCardName.focus();
				return;
			}

			const personalCard = {
				id: window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`,
				name,
				photo: personalCardPhoto.files[0] || null,
				audio: personalCardAudio.files[0] || null,
				createdAt: Date.now()
			};

			try {
				await savePersonalCard(personalCard);
				personalCards = [personalCard, ...personalCards];
				personalCardDialog.close();
				await personalCardsReady;
				showCategory(document.querySelector("[data-local-cards]"));
			} catch (error) {
				personalCardStatus.textContent = "Nepavyko išsaugoti kortelės šiame telefone.";
			}
		});

		if ("serviceWorker" in navigator && window.isSecureContext) {
			navigator.serviceWorker.register("./service-worker.js").catch(() => {});
		}
	</script>
</body>
</html>
