		const cookingSubgroups = document.querySelector("#cooking-subgroups");
		const itemsSubgroups = document.querySelector("#items-subgroups");
		const ingredientSubgroups = document.querySelector("#ingredient-subgroups");
		const householdChoresCards = document.querySelector("#household-chores-cards");
		const restCards = document.querySelector("#rest-cards");
		const entertainmentCards = document.querySelector("#entertainment-cards");
		const homeLocationCards = document.querySelector("#home-location-cards");
		const publicPlaceCards = document.querySelector("#public-place-cards");
		const naturePlaceCards = document.querySelector("#nature-place-cards");
		const transportCards = document.querySelector("#transport-cards");
		const sportCards = document.querySelector("#sport-cards");
		const ingredientCardTemplates = {
			"Vaisiai": document.querySelector("#fruit-cards"),
			"Uogos": document.querySelector("#berry-cards"),
			"Daržovės": document.querySelector("#vegetable-cards"),
			"Duona": document.querySelector("#bread-cards"),
			"Kiaušiniai": document.querySelector("#egg-cards"),
			"Pienas": document.querySelector("#dairy-cards"),
			"Mėsa": document.querySelector("#meat-cards"),
			"Žuvis": document.querySelector("#fish-cards"),
			"Paruošti produktai": document.querySelector("#prepared-food-cards"),
			"Makaronai": document.querySelector("#pasta-cards"),
			"Padažai": document.querySelector("#sauce-cards"),
			"Kruopos": document.querySelector("#grain-cards"),
			"Prieskoniai": document.querySelector("#spice-cards"),
			"Gaminimo procesas": document.querySelector("#cooking-process-cards"),
			"Indai": document.querySelector("#utensil-cards")
		};
		const originalEmotionCards = emotionGrid.innerHTML;
		const appShell = document.querySelector(".app-shell");
		let currentCategoryName = "";
		let currentSubgroup = false;
		let currentIngredientList = false;
		const gertiCards = [
			"Vanduo", "Sultys", "Vanduo su citrina", "Gazuotas vanduo",
			"Limonadas", "Kokteilis", "Kava", "Arbata", "Kakava", "Pienas"
		];
		const tualetasCards = [
			"Tualetas", "Tualetinis popierius", "Tualeto šepetys", "Oro gaiviklis",
			"Nuleisti vandenį", "Plauti rankas", "Skystas muilas", "Rankšluostis"
		];
		const bendravimasCards = [
			"Labas", "Taip", "Ne", "Stop", "Apsikabinkim", "Viso gero",
			"Atsiprašau", "Ačiū"
		];
		const skaudaCards = [
			"Dantys", "Gerklė", "Pilvas", "Galva", "Koja", "Nugara", "Ausis", "Ranka"
		];

		function renderWordCards(words) {
			return words.map((word) => `
				<article class="emotion-card emotion-card-placeholder">
					<div class="emotion-card-tools">
						<button class="emotion-audio" type="button" aria-label="Leisti garsą: ${word.toLowerCase()}">
							<span aria-hidden="true">◖))</span> Garsas
						</button>
						<span class="emotion-favorite" aria-hidden="true">♥</span>
					</div>
					<div class="emotion-photo-placeholder" aria-hidden="true"></div>
					<p>${word}</p>
				</article>
			`).join("");
		}

		function showCategory(categoryRow) {
			const categoryName = categoryRow.querySelectorAll(":scope > span")[1].textContent.trim();
			const categoryIcon = categoryRow.querySelector(".category-icon img");

			currentCategoryName = categoryName;
			currentSubgroup = false;
			currentIngredientList = false;
			emotionHeading.textContent = categoryName;
			emotionHeadingIcon.src = categoryIcon.src;
			foodSubgroups.hidden = categoryName !== "Valgyti";
			activitiesSubgroups.hidden = categoryName !== "Veiklos";
			locationsSubgroups.hidden = categoryName !== "Vietos";
			cookingSubgroups.hidden = categoryName !== "Gaminti";
			itemsSubgroups.hidden = categoryName !== "Daiktai";
			ingredientSubgroups.hidden = true;
			emotionGrid.hidden = categoryName === "Valgyti" || categoryName === "Veiklos" || categoryName === "Vietos" || categoryName === "Gaminti" || categoryName === "Daiktai";
			if (categoryName === "Emocijos") {
				emotionGrid.innerHTML = originalEmotionCards;
			} else if (categoryName === "Transportas") {
				emotionGrid.replaceChildren(transportCards.content.cloneNode(true));
			} else if (categoryName === "Sportas") {
				emotionGrid.replaceChildren(sportCards.content.cloneNode(true));
			} else if (categoryName === "Gerti") {
				emotionGrid.innerHTML = renderWordCards(gertiCards);
			} else if (categoryName === "Tualetas") {
				emotionGrid.innerHTML = renderWordCards(tualetasCards);
			} else if (categoryName === "Bendravimas") {
				emotionGrid.innerHTML = renderWordCards(bendravimasCards);
			} else if (categoryName === "Skauda") {
				emotionGrid.innerHTML = renderWordCards(skaudaCards);
			} else if (categoryName !== "Valgyti" && categoryName !== "Veiklos" && categoryName !== "Vietos" && categoryName !== "Gaminti" && categoryName !== "Daiktai") {
				emotionGrid.innerHTML = renderWordCards(Array.from({ length: 12 }, () => "Žodis"));
			}
			emotionGrid.setAttribute("aria-label", `${categoryName} kortelės`);

			categoriesTitle.hidden = true;
			categoryList.hidden = true;
			emotionView.hidden = false;
			appShell.classList.add("is-emotion-view");
			categoriesPanel.setAttribute("aria-labelledby", "emotion-title");
			window.scrollTo({ top: 0, behavior: "smooth" });
		}

		document.querySelectorAll(".category-row").forEach((categoryRow) => {
			categoryRow.addEventListener("click", () => showCategory(categoryRow));
		});

		document.querySelectorAll(".subcategory-row").forEach((subcategoryRow) => {
			subcategoryRow.addEventListener("click", () => {
				const subgroupName = subcategoryRow.querySelectorAll(":scope > span")[1].textContent.trim();
				const ingredientCardTemplate = ingredientCardTemplates[subgroupName];
				if ((subcategoryRow.closest("#ingredient-subgroups") || subcategoryRow.closest("#cooking-subgroups")) && ingredientCardTemplate) {
					currentSubgroup = true;
					currentIngredientList = Boolean(subcategoryRow.closest("#ingredient-subgroups"));
					emotionHeading.textContent = subgroupName;
					cookingSubgroups.hidden = true;
					ingredientSubgroups.hidden = true;
					emotionGrid.hidden = false;
					emotionGrid.replaceChildren(ingredientCardTemplate.content.cloneNode(true));
					emotionGrid.setAttribute("aria-label", `${subgroupName} kortelės`);
					return;
				}
				if (subgroupName === "Maisto produktai") {
					currentIngredientList = true;
					cookingSubgroups.hidden = true;
					ingredientSubgroups.hidden = false;
					emotionGrid.hidden = true;
					emotionHeading.textContent = subgroupName;
					return;
				}

				currentSubgroup = true;
				if (!subcategoryRow.closest("#ingredient-subgroups")) {
					currentIngredientList = false;
				}
				const subgroupCards = {
					"Patiekalai": [
						"Kepti kiaušiniai", "Virti kiaušiniai", "Omletas", "Salotos",
						"Kepsnys", "Burgeris", "Dešrelės", "Maltinukas",
						"Sriuba", "Lazanija", "Spagečiai", "Pica", "Blynai", "Lietiniai"
					],
					"Kepiniai": [
						"Juoda duona", "Duonelė", "Sumuštinių duona", "Ilgas batonas",
						"Kruasanas", "Bandelė", "Tortas", "Keksiukas"
					],
					"Saldumynai": [
						"Bandelė", "Ledai", "Saldainis", "Guminukai",
						"Sausainis", "Vaflis", "Šokoladas", "Čiulpinukas"
					],
					"Užkandžiai": [
						"Trapučiai", "Riešutai", "Džiovinti vaisiai",
						"Popkornai", "Traškučiai", "Lazdelės"
					]
				};
				const words = subgroupCards[subgroupName] || Array.from({ length: 12 }, () => "Žodis");
				emotionHeading.textContent = subgroupName;
				foodSubgroups.hidden = true;
				activitiesSubgroups.hidden = true;
				locationsSubgroups.hidden = true;
				cookingSubgroups.hidden = true;
					itemsSubgroups.hidden = true;
				ingredientSubgroups.hidden = true;
				emotionGrid.hidden = false;
				if (subgroupName === "Namų ruoša") {
					emotionGrid.replaceChildren(householdChoresCards.content.cloneNode(true));
				} else if (subgroupName === "Namai") {
					emotionGrid.replaceChildren(homeLocationCards.content.cloneNode(true));
				} else if (subgroupName === "Viešos erdvės") {
					emotionGrid.replaceChildren(publicPlaceCards.content.cloneNode(true));
				} else if (subgroupName === "Gamta") {
					emotionGrid.replaceChildren(naturePlaceCards.content.cloneNode(true));
				} else if (subgroupName === "Poilsis") {
					emotionGrid.replaceChildren(restCards.content.cloneNode(true));
				} else if (subgroupName === "Pramogos") {
					emotionGrid.replaceChildren(entertainmentCards.content.cloneNode(true));
				} else {
					emotionGrid.innerHTML = renderWordCards(words);
				}
				emotionGrid.setAttribute("aria-label", `${emotionHeading.textContent} kortelės`);
			});
		});

		document.querySelector("[data-back-categories]").addEventListener("click", () => {
			if (currentSubgroup && currentIngredientList) {
				currentSubgroup = false;
				emotionHeading.textContent = "Maisto produktai";
				ingredientSubgroups.hidden = false;
				emotionGrid.hidden = true;
				return;
			}

			if (currentIngredientList) {
				currentIngredientList = false;
				emotionHeading.textContent = currentCategoryName;
				cookingSubgroups.hidden = false;
				emotionGrid.hidden = true;
				return;
			}

			if (currentSubgroup) {
				currentSubgroup = false;
				emotionHeading.textContent = currentCategoryName;
				foodSubgroups.hidden = currentCategoryName !== "Valgyti";
				activitiesSubgroups.hidden = currentCategoryName !== "Veiklos";
				locationsSubgroups.hidden = currentCategoryName !== "Vietos";
				cookingSubgroups.hidden = currentCategoryName !== "Gaminti";
				itemsSubgroups.hidden = currentCategoryName !== "Daiktai";
				emotionGrid.hidden = true;
				return;
			}

			emotionView.hidden = true;
			categoriesTitle.hidden = false;
			categoryList.hidden = false;
			appShell.classList.remove("is-emotion-view");
			categoriesPanel.setAttribute("aria-labelledby", "categories-title");
		});

		if ("serviceWorker" in navigator && window.isSecureContext) {
			navigator.serviceWorker.register("./service-worker.js").catch(() => {});
		}
	</script>
</body>
</html>
