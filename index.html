		function openPersonalCardDatabase() {
			if (!("indexedDB" in window)) {
				return Promise.reject(new Error("Vietinė saugykla šiame įrenginyje nepasiekiama."));
			}
			if (!personalCardDatabasePromise) {
				personalCardDatabasePromise = new Promise((resolve, reject) => {
					const request = window.indexedDB.open("voicer-personal-cards", 1);
					request.onupgradeneeded = () => {
						if (!request.result.objectStoreNames.contains("cards")) {
							request.result.createObjectStore("cards", { keyPath: "id" });
						}
					};
					request.onsuccess = () => resolve(request.result);
					request.onerror = () => reject(request.error || new Error("Nepavyko atverti vietinės saugyklos."));
				});
			}
			return personalCardDatabasePromise;
		}

		async function loadPersonalCards() {
			const database = await openPersonalCardDatabase();
			return new Promise((resolve, reject) => {
				const request = database.transaction("cards", "readonly").objectStore("cards").getAll();
				request.onsuccess = () => resolve(request.result.sort((left, right) => right.createdAt - left.createdAt));
				request.onerror = () => reject(request.error || new Error("Nepavyko įkelti kortelių."));
			});
		}

		async function savePersonalCard(card) {
			const database = await openPersonalCardDatabase();
			return new Promise((resolve, reject) => {
				const transaction = database.transaction("cards", "readwrite");
				transaction.objectStore("cards").put(card);
				transaction.oncomplete = () => resolve();
				transaction.onerror = () => reject(transaction.error || new Error("Nepavyko išsaugoti kortelės."));
				transaction.onabort = () => reject(transaction.error || new Error("Kortelės išsaugoti nepavyko."));
			});
		}

		const personalCardsReady = loadPersonalCards().then((cards) => {
			personalCards = cards;
			return cards;
		}).catch((error) => {
			personalCardStorageError = error;
			return [];
		});

		function renderPersonalCards() {
			customCardObjectUrls.forEach((url) => URL.revokeObjectURL(url));
			customCardObjectUrls.clear();
			if (personalCards.length === 0) {
				const emptyMessage = document.createElement("p");
				emptyMessage.className = "personal-cards-empty";
				emptyMessage.textContent = personalCardStorageError ? "Vietinė saugykla nepasiekiama." : "Kortelių dar nėra.";
				emotionGrid.replaceChildren(emptyMessage);
			} else {
				const cards = personalCards.map((personalCard) => {
					const card = document.createElement("article");
					card.className = "emotion-card personal-emotion-card";
					card.dataset.personalCardId = personalCard.id;

					const tools = document.createElement("div");
					tools.className = "emotion-card-tools";

					const audioButton = document.createElement("button");
					audioButton.className = "emotion-audio";
					audioButton.type = "button";
					audioButton.setAttribute("aria-label", `Leisti garsą: ${personalCard.name.toLocaleLowerCase("lt-LT")}`);
					audioButton.innerHTML = '<span aria-hidden="true">◖))</span> Garsas';
					tools.append(audioButton);

					const photo = document.createElement("div");
					photo.className = "emotion-photo-placeholder personal-card-photo";
					if (personalCard.photo instanceof Blob) {
						const image = document.createElement("img");
						image.src = URL.createObjectURL(personalCard.photo);
						image.alt = "";
						customCardObjectUrls.set(personalCard.id, image.src);
						photo.append(image);
					}

					const label = document.createElement("p");
					label.textContent = personalCard.name;
					card.append(tools, photo, label);
					return card;
				});
				emotionGrid.replaceChildren(...cards);
			}
			emotionGrid.hidden = false;
			emotionGrid.setAttribute("aria-label", "Mano kortelės");
		}

		function showPhotoPreview(file) {
			if (personalCardPreviewUrl) {
				URL.revokeObjectURL(personalCardPreviewUrl);
				personalCardPreviewUrl = "";
			}
			personalCardPhotoPreview.replaceChildren();
			if (file) {
				personalCardPreviewUrl = URL.createObjectURL(file);
				const image = document.createElement("img");
				image.src = personalCardPreviewUrl;
				image.alt = "";
				personalCardPhotoPreview.append(image);
			}
		}

		function showAudioPreview(file) {
			if (personalCardAudioPreviewUrl) {
				URL.revokeObjectURL(personalCardAudioPreviewUrl);
				personalCardAudioPreviewUrl = "";
			}
			personalCardAudioPreview.pause();
			personalCardAudioPreview.removeAttribute("src");
			personalCardAudioPreview.hidden = !file;
			if (file) {
				personalCardAudioPreviewUrl = URL.createObjectURL(file);
				personalCardAudioPreview.src = personalCardAudioPreviewUrl;
			}
		}

		function resetPersonalCardRecordingControls() {
			personalCardAudio.disabled = false;
			personalCardRecordButton.disabled = false;
			personalCardRecordButton.hidden = false;
			personalCardStopRecordingButton.disabled = false;
			personalCardStopRecordingButton.hidden = true;
			personalCardSubmitButton.disabled = false;
		}

		async function startPersonalCardRecording() {
			if (!window.isSecureContext) {
				personalCardStatus.textContent = "Mikrofonui reikia HTTPS arba localhost.";
				return;
			}
			if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
				personalCardStatus.textContent = "Ši naršyklė nepalaiko įrašymo per mikrofoną.";
				return;
			}

			const requestId = ++personalCardRecordingRequestId;
			personalCardRecordButton.disabled = true;
			personalCardSubmitButton.disabled = true;
			personalCardStatus.textContent = "Prašoma prieigos prie mikrofono...";
			let stream = null;
			let session = null;

			try {
				personalCardAudio.value = "";
				personalCardRecordedAudio = null;
				showAudioPreview(null);
				stream = await navigator.mediaDevices.getUserMedia({ audio: true });
				if (requestId !== personalCardRecordingRequestId || !personalCardDialog.open) {
					stream.getTracks().forEach((track) => track.stop());
					return;
				}

				const mimeType = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4"]
					.find((type) => MediaRecorder.isTypeSupported(type));
				const recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
				session = { recorder, stream, chunks: [], discard: false };
				personalCardRecordingSession = session;
				recorder.addEventListener("dataavailable", (event) => {
					if (event.data.size > 0) {
						session.chunks.push(event.data);
					}
				});
				recorder.addEventListener("error", () => {
					session.discard = true;
					personalCardStatus.textContent = "Nepavyko įrašyti garso.";
				}, { once: true });
				recorder.addEventListener("stop", () => {
					session.stream.getTracks().forEach((track) => track.stop());
					if (personalCardRecordingSession === session) {
						personalCardRecordingSession = null;
					}
					resetPersonalCardRecordingControls();
					if (session.discard || !personalCardDialog.open) {
						return;
					}

					const audioBlob = new Blob(session.chunks, {
						type: recorder.mimeType || session.chunks[0]?.type || "audio/webm"
					});
					if (!audioBlob.size) {
						personalCardStatus.textContent = "Nepavyko įrašyti garso.";
						return;
					}
					personalCardRecordedAudio = audioBlob;
					showAudioPreview(audioBlob);
					personalCardStatus.textContent = "Įrašas paruoštas. Galite jį perklausyti.";
				}, { once: true });

				recorder.start();
				personalCardRecordButton.hidden = true;
				personalCardStopRecordingButton.hidden = false;
				personalCardAudio.disabled = true;
				personalCardStatus.textContent = "Įrašoma...";
			} catch {
				if (session) {
					session.discard = true;
					if (personalCardRecordingSession === session) {
						personalCardRecordingSession = null;
					}
				}
				stream?.getTracks().forEach((track) => track.stop());
				if (requestId !== personalCardRecordingRequestId) {
					return;
				}
				resetPersonalCardRecordingControls();
				personalCardStatus.textContent = "Nepavyko pasiekti mikrofono. Patikrinkite naršyklės leidimus.";
			}
		}

		function toGenitive(word) {
			const normalizedWord = word.toLocaleLowerCase("lt-LT");
			if (genitiveOverrides.has(normalizedWord)) {
				return genitiveOverrides.get(normalizedWord);
			}

			if (normalizedWord.endsWith("iai")) {
				return `${normalizedWord.slice(0, -3)}ių`;
			}
			if (normalizedWord.endsWith("ai")) {
				return `${normalizedWord.slice(0, -2)}ų`;
			}
			if (normalizedWord.endsWith("ės")) {
				return `${normalizedWord.slice(0, -2)}ių`;
			}
			if (normalizedWord.endsWith("os")) {
				return `${normalizedWord.slice(0, -2)}ų`;
			}
			if (normalizedWord.endsWith("ys")) {
				return `${normalizedWord.slice(0, -2)}io`;
			}
			if (normalizedWord.endsWith("as")) {
				return `${normalizedWord.slice(0, -2)}o`;
			}
			if (normalizedWord.endsWith("is")) {
				return `${normalizedWord.slice(0, -2)}io`;
			}
			if (normalizedWord.endsWith("ė")) {
				return `${normalizedWord.slice(0, -1)}ės`;
			}
			if (normalizedWord.endsWith("a")) {
				return `${normalizedWord.slice(0, -1)}os`;
			}
			if (normalizedWord.endsWith("us")) {
				return `${normalizedWord.slice(0, -2)}aus`;
			}
			return word;
		}

		function stopAudioPlayback() {
			if ("speechSynthesis" in window) {
				window.speechSynthesis.cancel();
			}
			if (activeAudioPlayer) {
				activeAudioPlayer.pause();
				activeAudioPlayer.removeAttribute("src");
				activeAudioPlayer.load();
				activeAudioPlayer.remove();
				activeAudioPlayer = null;
			}
			if (activeAudioUrl) {
				URL.revokeObjectURL(activeAudioUrl);
				activeAudioUrl = "";
			}
		}

		function playAudioSource(audioSource, reusePlayer = false) {
			if (!reusePlayer) {
				stopAudioPlayback();
			}
			const canReusePlayer = reusePlayer && activeAudioPlayer && !(activeAudioPlayer instanceof HTMLVideoElement);
			if (canReusePlayer && activeAudioUrl) {
				URL.revokeObjectURL(activeAudioUrl);
				activeAudioUrl = "";
			}
			return new Promise((resolve, reject) => {
				const audioUrl = audioSource instanceof Blob ? URL.createObjectURL(audioSource) : "";
				const player = canReusePlayer
					? activeAudioPlayer
					: audioSource instanceof Blob && audioSource.type.startsWith("video/")
						? document.createElement("video")
						: new Audio();
				let finished = false;
				activeAudioPlayer = player;
				activeAudioUrl = audioUrl;
				player.src = audioUrl || audioSource;
				if (player instanceof HTMLVideoElement) {
					player.playsInline = true;
					player.setAttribute("aria-hidden", "true");
					player.tabIndex = -1;
					player.style.position = "fixed";
					player.style.width = "1px";
					player.style.height = "1px";
					player.style.opacity = "0";
					document.body.append(player);
				}

				const finish = (error) => {
					if (finished) {
						return;
					}
					finished = true;
					if (audioUrl && (!reusePlayer || error)) {
						URL.revokeObjectURL(audioUrl);
					}
					if (activeAudioPlayer === player && (!reusePlayer || error)) {
						activeAudioPlayer = null;
						activeAudioUrl = "";
					}
					if (!reusePlayer) {
						player.remove();
					}
					if (error) {
						reject(error);
					} else {
						resolve();
					}
				};

				player.addEventListener("ended", () => finish(), { once: true });
				player.addEventListener("error", () => finish(new Error("Nepavyko paleisti garso įrašo.")), { once: true });
				player.play().catch(finish);
			});
		}

		function playAudioBlob(audioBlob) {
			return playAudioSource(audioBlob);
		}

		async function loadAudioSource(audioSource) {
			if (!audioSource) {
				return null;
			}
			try {
				const response = await fetch(audioSource);
				return response.ok ? await response.blob() : null;
			} catch {

			}
		}

		async function speakSentence() {
			const sentenceWords = composeSentenceWords();
			stopAudioPlayback();
			for (const [index, { audio, audioSource }] of selectedWords.entries()) {
				const wordAudio = audio instanceof Blob ? audio : await loadAudioSource(audioSource);
				if (wordAudio) {
					try {
						await playAudioSource(wordAudio, true);
						continue;
					} catch (error) {
						// Fall back to the word's spoken form when its recording cannot be played.
					}
				}
				await speakText(sentenceWords[index]);
			}
		}

		function speakText(text) {
			if (!text || !("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
				return Promise.resolve();
			}
			stopAudioPlayback();
			return new Promise((resolve) => {
				const utterance = new SpeechSynthesisUtterance(text);
				utterance.lang = "lt-LT";
				utterance.onend = resolve;
				utterance.onerror = resolve;
				window.speechSynthesis.speak(utterance);
			});
		}

			appShell.classList.remove("is-colors-view");
			appShell.classList.remove("is-numbers-view");
			appShell.classList.remove("is-hygiene-view");
			appShell.classList.remove("is-clothing-view");
			categoriesPanel.setAttribute("aria-labelledby", "categories-title");
		}

		function showCategory(categoryRow) {
			const categoryName = categoryRow.querySelectorAll(":scope > span")[1].textContent.trim();
			const categoryIcon = categoryRow.querySelector(".category-icon img");

			currentCategoryName = categoryName;
			currentSubgroup = false;
			currentIngredientList = false;
			emotionView.classList.toggle("emotion-view--food", categoryName === "Valgyti");
			emotionView.classList.toggle("emotion-view--drink", categoryName === "Gerti");
			emotionView.classList.toggle("emotion-view--toilet", categoryName === "Tualetas");
			emotionView.classList.toggle("emotion-view--communication", categoryName === "Bendravimas");
			emotionView.classList.toggle("emotion-view--pain", categoryName === "Skauda");
			emotionView.classList.toggle("emotion-view--activities", categoryName === "Veiklos");
			emotionView.classList.toggle("emotion-view--locations", categoryName === "Vietos");
			emotionView.classList.toggle("emotion-view--transport", categoryName === "Transportas");
			emotionView.classList.toggle("emotion-view--cooking", categoryName === "Gaminti");
			emotionView.classList.toggle("emotion-view--sport", categoryName === "Sportas");
			emotionView.classList.toggle("emotion-view--personal-items", categoryName === "Asmeniniai daiktai");
			emotionView.classList.toggle("emotion-view--colors", categoryName === "Spalvos");
			emotionView.classList.toggle("emotion-view--numbers", categoryName === "Skaičiai");
			emotionView.classList.toggle("emotion-view--hygiene", categoryName === "Higiena");
			emotionView.classList.toggle("emotion-view--clothing", categoryName === "Apranga");
			appShell.classList.toggle("is-food-view", categoryName === "Valgyti");
			appShell.classList.toggle("is-drink-view", categoryName === "Gerti");
			appShell.classList.toggle("is-toilet-view", categoryName === "Tualetas");
			appShell.classList.toggle("is-communication-view", categoryName === "Bendravimas");
			appShell.classList.toggle("is-pain-view", categoryName === "Skauda");
			appShell.classList.toggle("is-activities-view", categoryName === "Veiklos");
			appShell.classList.toggle("is-locations-view", categoryName === "Vietos");
			appShell.classList.toggle("is-transport-view", categoryName === "Transportas");
			appShell.classList.toggle("is-cooking-view", categoryName === "Gaminti");
			appShell.classList.toggle("is-sport-view", categoryName === "Sportas");
			appShell.classList.toggle("is-personal-items-view", categoryName === "Asmeniniai daiktai");
			appShell.classList.toggle("is-colors-view", categoryName === "Spalvos");
			appShell.classList.toggle("is-numbers-view", categoryName === "Skaičiai");
			appShell.classList.toggle("is-hygiene-view", categoryName === "Higiena");
			appShell.classList.toggle("is-clothing-view", categoryName === "Apranga");
			emotionHeading.textContent = categoryName;
			emotionHeadingIcon.src = categoryIcon.src;
			foodSubgroups.hidden = categoryName !== "Valgyti";
			activitiesSubgroups.hidden = categoryName !== "Veiklos";
			locationsSubgroups.hidden = categoryName !== "Vietos";
			cookingSubgroups.hidden = categoryName !== "Gaminti";
			ingredientSubgroups.hidden = true;
			emotionGrid.hidden = categoryName === "Valgyti" || categoryName === "Veiklos" || categoryName === "Vietos" || categoryName === "Gaminti";
			if (categoryName === "Mano kortelės") {
				renderPersonalCards();
			} else if (categoryName === "Transportas") {
				emotionGrid.replaceChildren(transportCards.content.cloneNode(true));
			} else if (categoryName === "Sportas") {
				emotionGrid.replaceChildren(sportCards.content.cloneNode(true));
			} else if (categoryName === "Asmeniniai daiktai") {
				emotionGrid.innerHTML = renderWordCards(personalItemsCards);
			} else if (categoryName === "Apranga") {
				emotionGrid.innerHTML = renderWordCards(clothingCards);
			} else if (categoryName === "Higiena") {
				emotionGrid.innerHTML = renderWordCards(hygieneCards);
			} else if (categoryName === "Gerti") {
				emotionGrid.innerHTML = renderWordCards(gertiCards);
			} else if (categoryName === "Tualetas") {
				emotionGrid.innerHTML = renderWordCards(tualetasCards);
			} else if (categoryName === "Bendravimas") {
				emotionGrid.innerHTML = renderWordCards(bendravimasCards);
			} else if (categoryName === "Skauda") {
				emotionGrid.innerHTML = renderWordCards(skaudaCards);
			} else if (categoryName === "Skaičiai") {
				emotionGrid.innerHTML = renderWordCards(numberCards);
			} else if (categoryName === "Spalvos") {
				emotionGrid.innerHTML = renderWordCards(colorCards);
			} else if (categoryName === "Laikas") {
				emotionGrid.innerHTML = renderWordCards(timeCards);
			} else if (categoryName !== "Valgyti" && categoryName !== "Veiklos" && categoryName !== "Vietos" && categoryName !== "Gaminti") {
				emotionGrid.innerHTML = renderWordCards(Array.from({ length: 12 }, () => "Žodis"));
			}
			emotionGrid.setAttribute("aria-label", `${categoryName} kortelės`);

			categoriesTitle.hidden = true;
			categoryList.hidden = true;
			emotionView.hidden = false;
			appShell.classList.add("is-emotion-view");
			categoriesPanel.setAttribute("aria-labelledby", "emotion-title");
			window.scrollTo({ top: 0, behavior: "smooth" });
		}

		document.getElementById("emotion-back").addEventListener("click", goBackToCategories);
		document.getElementById("nav-back").addEventListener("click", goBackToCategories);

		function goHome() {
			emotionView.hidden = true;
			categoriesTitle.hidden = false;
			categoryList.hidden = false;
			appShell.classList.remove("is-emotion-view");
			appShell.classList.remove("is-food-view");
			appShell.classList.remove("is-drink-view");
			appShell.classList.remove("is-toilet-view");
			appShell.classList.remove("is-communication-view");
			appShell.classList.remove("is-pain-view");
			appShell.classList.remove("is-activities-view");
			appShell.classList.remove("is-locations-view");
			appShell.classList.remove("is-transport-view");
			appShell.classList.remove("is-cooking-view");
			appShell.classList.remove("is-sport-view");
			appShell.classList.remove("is-personal-items-view");
			appShell.classList.remove("is-colors-view");
			appShell.classList.remove("is-numbers-view");
			appShell.classList.remove("is-hygiene-view");
			appShell.classList.remove("is-clothing-view");
			categoriesPanel.setAttribute("aria-labelledby", "categories-title");
		}

		document.getElementById("desktop-home").addEventListener("click", goHome);
		document.getElementById("nav-home").addEventListener("click", goHome);

		document.querySelectorAll(".category-row").forEach((categoryRow) => {
			categoryRow.addEventListener("click", async () => {
				if (categoryRow.hasAttribute("data-local-cards")) {
					personalCards = await personalCardsReady;
				}
				showCategory(categoryRow);
			});
		});

		document.querySelectorAll(".subcategory-row").forEach((subcategoryRow) => {
			subcategoryRow.addEventListener("click", () => {
				const subgroupName = subcategoryRow.querySelectorAll(":scope > span")[1].textContent.trim();
				const ingredientCardTemplate = ingredientCardTemplates[subgroupName];
				if ((subcategoryRow.closest("#ingredient-subgroups") || subcategoryRow.closest("#cooking-subgroups")) && ingredientCardTemplate) {
					currentSubgroup = true;
					currentIngredientList = Boolean(subcategoryRow.closest("#ingredient-subgroups"));
					emotionHeading.textContent = subgroupName;
					cookingSubgroups.hidden = true;
					ingredientSubgroups.hidden = true;
					emotionGrid.hidden = false;
					emotionGrid.replaceChildren(ingredientCardTemplate.content.cloneNode(true));
					emotionGrid.setAttribute("aria-label", `${subgroupName} kortelės`);
					return;
				}
				if (subgroupName === "Maisto produktai") {
					currentIngredientList = true;
					cookingSubgroups.hidden = true;
					ingredientSubgroups.hidden = false;
					emotionGrid.hidden = true;
					emotionHeading.textContent = subgroupName;
					return;
				}
				currentSubgroup = true;
				if (!subcategoryRow.closest("#ingredient-subgroups")) {
					currentIngredientList = false;
				}
				const subgroupCards = {
					"Patiekalai": [
						"Kepti kiaušiniai", "Virti kiaušiniai", "Omletas", "Salotos",
						"Kepsnys", "Burgeris", "Dešrelės", "Maltinukas",
						"Sriuba", "Lazanija", "Spagečiai", "Pica", "Blynai", "Lietiniai"
					],
					"Kepiniai": [
						"Juoda duona", "Duonelė", "Sumuštinių duona", "Ilgas batonas",
						"Kruasanas", "Bandelė", "Tortas", "Keksiukas"
					],
					"Saldumynai": [
						"Bandelė", "Ledai", "Saldainis", "Guminukai",
						"Sausainis", "Vaflis", "Šokoladas", "Čiulpinukas"
					],
					"Užkandžiai": [
						"Trapučiai", "Riešutai", "Džiovinti vaisiai",
						"Popkornai", "Traškučiai", "Lazdelės"
					],
					"Skaičiai": numberCards,
					"Spalvos": colorCards
				};
				if (subgroupName === "Skaičiai") {
					emotionHeading.textContent = subgroupName;
					foodSubgroups.hidden = true;
					activitiesSubgroups.hidden = true;
					locationsSubgroups.hidden = true;
					cookingSubgroups.hidden = true;
					ingredientSubgroups.hidden = true;
					emotionGrid.hidden = false;
					emotionGrid.innerHTML = renderWordCards(numberCards);
					emotionGrid.setAttribute("aria-label", `${subgroupName} kortelės`);
					return;
				}
				if (subgroupName === "Spalvos") {
					emotionHeading.textContent = subgroupName;
					foodSubgroups.hidden = true;
					activitiesSubgroups.hidden = true;
					locationsSubgroups.hidden = true;
					cookingSubgroups.hidden = true;
					ingredientSubgroups.hidden = true;
					emotionGrid.hidden = false;
					emotionGrid.innerHTML = renderWordCards(colorCards);
					emotionGrid.setAttribute("aria-label", `${subgroupName} kortelės`);
					return;
				}
				const words = subgroupCards[subgroupName] || Array.from({ length: 12 }, () => "Žodis");
				emotionHeading.textContent = subgroupName;
				foodSubgroups.hidden = true;
				activitiesSubgroups.hidden = true;
				locationsSubgroups.hidden = true;
				cookingSubgroups.hidden = true;
				ingredientSubgroups.hidden = true;
				emotionGrid.hidden = false;
				if (subgroupName === "Namų ruoša") {
					emotionGrid.replaceChildren(householdChoresCards.content.cloneNode(true));
				} else if (subgroupName === "Namai") {
					emotionGrid.replaceChildren(homeLocationCards.content.cloneNode(true));
				} else if (subgroupName === "Viešos erdvės") {
					emotionGrid.replaceChildren(publicPlaceCards.content.cloneNode(true));
				} else if (subgroupName === "Gamta") {
					emotionGrid.replaceChildren(naturePlaceCards.content.cloneNode(true));
				} else if (subgroupName === "Poilsis") {
					emotionGrid.replaceChildren(restCards.content.cloneNode(true));
				} else if (subgroupName === "Pramogos") {
					emotionGrid.replaceChildren(entertainmentCards.content.cloneNode(true));
				} else {
					emotionGrid.innerHTML = renderWordCards(words);
				}
				emotionGrid.setAttribute("aria-label", `${emotionHeading.textContent} kortelės`);
			});
		});

		emotionGrid.addEventListener("click", (event) => {
			const card = event.target.closest(".emotion-card");
			if (!card) {
				return;
			}
			const word = card.querySelector("p")?.textContent.trim();
			const personalCard = personalCards.find(({ id }) => id === card.dataset.personalCardId);
			if (event.target.closest(".emotion-audio")) {
				if (personalCard?.audio instanceof Blob) {
					playAudioBlob(personalCard.audio).catch(() => speakText(word));
				} else {
					const cardAudioSource = getCardAudioSource(word);
					if (cardAudioSource) {
						loadAudioSource(cardAudioSource)
							.then((audioBlob) => audioBlob ? playAudioBlob(audioBlob) : speakText(word))
							.catch(() => speakText(word));
					} else {
						speakText(word);
					}
				}
				return;
			}
			addSelectedWord(word, personalCard?.photo || getCardImageSource(word) || null, personalCard?.audio || null, personalCard ? "" : getCardAudioSource(word) || "");
		});

		emotionGrid.addEventListener("keydown", (event) => {
			if (!event.target.matches(".emotion-card") || (event.key !== "Enter" && event.key !== " ")) {
				return;
			}
			event.preventDefault();
			const card = event.target;
			const personalCard = personalCards.find(({ id }) => id === card.dataset.personalCardId);
			const word = card.querySelector("p")?.textContent.trim();
			addSelectedWord(word, personalCard?.photo || getCardImageSource(word) || null, personalCard?.audio || null, personalCard ? "" : getCardAudioSource(word) || "");
		});

		document.querySelector(".quick-phrases").addEventListener("click", async (event) => {
			const phraseButton = event.target.closest(".phrase-chip");
			const phrase = phraseButton?.querySelector(".phrase-chip-label")?.textContent;
			if (phrase) {
				addSelectedWord(phrase, null, await loadPhraseAudio(phraseButton));
			}
		});

		selectedWordsTray.addEventListener("click", (event) => {
			const removeButton = event.target.closest("[data-remove-selected-word]");
			if (!removeButton) {
				return;
			}
			const selectedWordId = Number(removeButton.dataset.removeSelectedWord);
			selectedWords = selectedWords.filter(({ id }) => id !== selectedWordId);
			renderSelectedWords();
		});

		document.getElementById("sentence-speak").addEventListener("click", () => {
			speakSentence();
		});

		document.getElementById("create-card-button").addEventListener("click", async () => {
			await personalCardsReady;
			personalCardStatus.textContent = personalCardStorageError ? "Šiame įrenginyje nepavyko atverti vietinės saugyklos." : "";
			personalCardDialog.showModal();
			personalCardName.focus();
		});

		personalCardPhoto.addEventListener("change", () => {
			showPhotoPreview(personalCardPhoto.files[0]);
		});

		personalCardAudio.addEventListener("change", () => {
			personalCardRecordedAudio = null;
			showAudioPreview(personalCardAudio.files[0]);
		});

		personalCardRecordButton.addEventListener("click", startPersonalCardRecording);
		personalCardStopRecordingButton.addEventListener("click", stopPersonalCardRecording);

		document.getElementById("close-personal-card-dialog").addEventListener("click", () => personalCardDialog.close());
		document.getElementById("cancel-personal-card").addEventListener("click", () => personalCardDialog.close());
		personalCardDialog.addEventListener("close", () => {
			personalCardRecordingRequestId += 1;
			if (personalCardRecordingSession) {
				personalCardRecordingSession.discard = true;
				if (personalCardRecordingSession.recorder.state !== "inactive") {
					personalCardRecordingSession.recorder.stop();
				}
				personalCardRecordingSession.stream.getTracks().forEach((track) => track.stop());
				personalCardRecordingSession = null;
			}
			personalCardRecordedAudio = null;
			personalCardForm.reset();
			personalCardStatus.textContent = "";
			showPhotoPreview(null);
			showAudioPreview(null);
			resetPersonalCardRecordingControls();
		});

		personalCardForm.addEventListener("submit", async (event) => {
			event.preventDefault();
			const name = personalCardName.value.trim();
			if (!name) {
				personalCardName.focus();
				return;
			}

			const personalCard = {
				id: window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`,
				name,
				photo: personalCardPhoto.files[0] || null,
				audio: personalCardRecordedAudio || personalCardAudio.files[0] || null,
				createdAt: Date.now()
			};

			try {
				await savePersonalCard(personalCard);
				personalCards = [personalCard, ...personalCards];
				personalCardDialog.close();
				await personalCardsReady;
				showCategory(document.querySelector("[data-local-cards]"));
			} catch (error) {
				personalCardStatus.textContent = "Nepavyko išsaugoti kortelės šiame telefone.";
			}
		});

		if ("serviceWorker" in navigator && window.isSecureContext) {
			navigator.serviceWorker.register("./service-worker.js").catch(() => {});
		}
	</script>
</body>
</html>
